schema_version: 6
landmark_nomination:
  max_calls: 1
  max_names: 12
  input_tokens: 8000
  output_tokens: 2000
  call_timeout_seconds: 20
  supplementary_searches: 4
input_assistance:
  destination:
    min_chars: 2
    max_chars: 100
    result_limit: 5
    timeout_seconds: 3
    minimum_interval_seconds: 1.1
    daily_attempts_per_process: 100
  polishing:
    source_max_chars: 4000
    source_max_tokens: 1500
    model_input_tokens_per_call: 8000
    draft_output_tokens: 2000
    call_timeout_seconds: 20
    total_timeout_seconds: 40
    daily_operations_per_process: 20
reference_discovery:
  policy_version: nearby_references_1
  max_requests: 3
  max_result_count: 10
  radius_metres: 800
  anchor_reuse_metres: 300
  deadline_seconds: 10
  request_timeout_seconds: 4
  retries: 0
  max_references: 3
  rank_preference: DISTANCE
  included_types:
  - restaurant
  - cafe
  - park
  - museum
app:
  time_zone: Australia/Sydney
budget:
  candidates: 64
  final_pois: 20
  places:
    destination_search_calls: 1
    candidate_search_calls: 12
    detail_calls: 60
    review_detail_calls: 8
  weather:
    calls: 2
  routes:
    matrix_elements: 64
    baseline_elements_per_request: 64
    baseline_elements_per_run: 400
    baseline_calls: 7
    alternative_pairs: 32 # Distinct directed pairs, independent of mode/time.
    alternative_matrix_calls: 32 # Actual sends across pre/post generation.
    alternative_elements: 64 # Requested origins times destinations, including failures.
    post_generation_reserved_pairs: 16
    post_generation_reserved_requests: 16
    post_generation_reserved_elements: 32
    work_seconds: 120 # Cumulative monotonic route-work wall time; pauses exclude LLM/Web.
    post_generation_reserved_seconds: 30
    provider_timeout_seconds: 20
  web:
    evidence_tasks: 8
    page_fetches: 8
  experience:
    review_enriched_places: 8
    profile_llm_calls: 8
web_evidence:
  reasoning_effort: low
  max_tool_calls: 2
  search_context_size: low
  timeout_seconds: 20
  authority_domain_overrides: []
  page_retrieval:
    max_targets_per_need: 2
    max_redirects: 2
    timeout_seconds: 10
    max_response_bytes: 262144
    max_text_chars: 20000
  claim_extraction:
    max_native_sources: 3
    max_native_snippet_chars: 1200
    max_candidates_per_call: 3
    max_calls_per_need: 3
    max_extraction_output_units: 1200
logging:
  level: INFO
  console: true
trace:
  enabled: true
  directory: logs
  payload_level: metadata
  capture_llm: true
  capture_tools: true
  capture_evidence: true
  raw_provider_payloads: false
  max_payload_bytes: 10000000
tripworld_discovery:
  version: tripworld_runtime_1
  top_k: 20
  resolution_entities: 30
  details_calls: 30
  fallback_calls: 4
  radius_km: 15
  identity_radius_km: 1
  deadline_seconds: 360
  embedding_timeout: 8
  sql_timeout: 60
  connect_timeout: 10
  google_timeout: 4
  retries: 0
  max_queries: 4
  max_positions: 80
  total_query_tokens: 2048
acquisition:
  policy_id: quality_first_1
  details_deadline_seconds: 120
  details_timeout_seconds: 20
main_generation:
  enabled: true
  input_tokens: 252000
  output_tokens: 16384
  framing_tokens: 2048
development_timeout_seconds: 600

transport:
  walk_route_max_km: 3 # Provider route distance; geographic prefilters are separate.
  transit_max_minutes: 45 # Applicable provider total duration, including its access legs.
  drive_max_minutes: 30 # Provider driving duration only.
  drive_reserve_minutes: 10 # Additional application occupancy, never provider duration.
  # Discovery / no-route filter; usable API routes proceed to burden and detour checks.
  walk_radius_km: 2
  motor_radius_km: 5
  max_leg_minutes: 45

# V3-only development policy. Acquisition totals are shared across all rounds.
v3_repair:
  max_rounds: 6 # Model round ceiling; shared stage deadline may stop earlier.
  max_model_calls: 6 # Shared local/replan sends; zero disables only model attempts.
  max_deletion_attempts: 12 # Separate finite system proposals; zero disables enumeration.
  reason_compression:
    max_calls: 1 # Stage-wide explanation-only batch, separate from proposal sends.
    input_tokens: 32000 # System/user/schema plus the shared Repair framing reserve.
    output_tokens: 8192
    timeout_seconds: 30 # Also bounded by round/stage/request time and recheck reserve.
  quantity_review_enabled: true # CLI may explicitly disable this review policy.
  overfull_review_enabled: false # Independent from shortage review.
  daily_main_min: 2 # Application coverage reference, not an unconditional quota.
  daily_main_max: 5 # Review target permits exactly this many distinct main POIs.
  move_max_days: 1 # Per move from the original activity date; 0 disables automatic moves.
  blank_day_start_hour: 9 # Destination-local; only originally empty/missing dates.
  blank_day_end_hour: 18 # Exclusive local endpoint; fixed time has precedence.
  alternatives_per_gap: 2 # Preparation reference, not an acceptance requirement.
  exploration_positions: 2 # Stage-wide reusable positions within the same ID union.
  timing:
    stage_seconds: 420
    round_seconds: 150
    model_seconds: 70
    preparation_seconds: 60 # Upper bound; model startup and recheck reserves take precedence.
    recheck_reserve_seconds: 20
    minimum_model_seconds: 30
    round_reference_seconds: 120
    finalization_reserve_seconds: 1
    # Nearby reservation uses reference_discovery.deadline_seconds above.
  input:
    input_tokens: 252000 # Per-call system/user/schema/framing total; fail closed.
    output_tokens: 16384
    framing_tokens: 2048
    identity_capacity: 32 # Scheduled context UNION operation candidates, per call.
    activity_capacity: 120
    candidate_characters: 12000
    feedback_characters: 12000
  acquisition:
    google: 6 # Stage total; ordinary discovery <= total minus reserved fallback (5).
    fallback: 1
    embedding: 1
    retrieval: 1
    canonical: 30 # Processing attempts, including failed attempts.
    details: 30
    routes: 24 # All modes and rounds share actual sends.
    post_proposal_route_reserve: 8 # Preparation ceiling is routes minus this reserve.
    elements: 32 # Actual origin count times destination count, not returned rows.
    top_k: 10
    provider_timeout_seconds: 20
  spatial:
    detour_floor_km: 1
    detour_ratio: 0.5
    fallback_distance_km: 1
    fallback_reserve_minutes: 45 # No-route schedule reserve, not a provider duration or extra API-route buffer.
    daily_added_minutes: 90 # Cumulative per day against the stage-original itinerary.

# Request-wide semantic assessment; shared by primary preparation and all Repair rounds.
poi_semantics:
  max_calls: 6
  batch_size: 32
  input_tokens: 32000
  output_tokens: 8192
  call_timeout_seconds: 45
  total_seconds: 120
  exploration_fraction: 0.3333333333333333
  exception_alternatives: 2
