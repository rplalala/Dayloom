clude exactly one visit to Sagrada Família during the trip. Do not include a visit to Park Güell. We are flexible about the other sightseeing choices.":"我们是两位成年人，对建筑和历史感兴趣。全程必须恰好参观一次圣家堂（Sagrada Família），不要安排参观古埃尔公园（Park Güell）。其他观光选择可灵活安排。","We are two adults taking a weekend trip to Singapore. We would like a fairly full itinerary that combines gardens with major city sights and views. Use public transport and walking only; do not include car, taxi or ride-hailing transfers. We prefer to make active use of both days.":"我们是两位成年人，周末前往新加坡。希望行程较充实，兼顾花园、主要城市景点和观景体验。仅使用公共交通和步行，不要安排汽车、出租车或网约车接驳。我们希望充分利用这两天。","We are two adults visiting Tokyo for the first time. We would like a balanced introduction to the city, including well-known sights, traditional culture and modern urban neighbourhoods. We prefer a moderate pace with enough time to enjoy each place.":"我们是两位成年人，首次到访东京。希望均衡地认识这座城市，包括知名景点、传统文化和现代城市街区。我们偏好适中的节奏，并留出足够时间体验各个地方。","We are two adults who enjoy art and architecture and prefer a moderate pace. Leave 14:00–16:00 on 2026-10-23, Paris local time, unscheduled for an online meeting. Do not schedule any activities or travel during that interval. The rest of our time is flexible.":"我们是两位成年人，喜欢艺术和建筑，偏好适中的节奏。请将巴黎当地时间 2026-10-23 的 14:00–16:00 留空，用于线上会议；这段时间不要安排任何活动或交通。其余时间可灵活安排。","We are two adults who enjoy nature and harbour views and prefer a relaxed pace overall. On 2026-10-22, plan exactly one sightseeing visit. Leave 2026-10-25 completely free of planned activities and travel as a rest day. We are flexible about the sightseeing choices on the other dates.":"我们是两位成年人，喜欢自然和海港景色，整体偏好轻松的节奏。2026-10-22 必须恰好安排一次观光参观。2026-10-25 为休息日，整天不要安排任何活动或交通。其他日期的观光选择可灵活安排。","Akihabara Electric Town":"秋叶原电器街（Akihabara Electric Town）","Arc de Triomphe":"凯旋门（Arc de Triomphe）","Art Gallery of New South Wales":"新南威尔士州美术馆（Art Gallery of New South Wales）","ArtScience Museum":"艺术科学博物馆（ArtScience Museum）","Audley, Royal National Park":"皇家国家公园奥德利地区（Audley, Royal National Park）","Australian Mus
