[project]
name = "reliable-trip-plan-agent"
version = "0.1.0"
description = "A reliable LLM-based travel planning system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "openai>=3.13,<4.0",
    "tzdata>=2025.2",
    "uvicorn>=0.35,<1.0",
    "pyarrow>=18,<24",
    "tiktoken>=0.9,<1",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
]

[project.scripts]
dayloom = "backend.cli.dayloom:main"
rtpeval = "backend.cli.rtpeval:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    {include-group = "retrieval"},
    "playwright==1.58.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]
retrieval = [
    "numpy>=2,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv.build-backend]
module-name = "backend"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
