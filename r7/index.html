/* r4: requested home composition, reversible preference editor, five stages,
   and stable authentication tabs. Existing itinerary styles remain unchanged. */
.home-discovery .intro-rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px;padding:31px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.home-discovery .intro-rail>div{display:flex;gap:14px;min-width:0}
.home-discovery .intro-rail .ico{color:var(--accent);margin-top:4px}
.home-discovery .intro-rail strong{font-size:13px}
.home-discovery .intro-rail p{font-size:11px;color:var(--muted);margin:6px 0 0;line-height:1.8}
.home-discovery>.section{padding:68px 0}
.home-discovery .section-heading h2{font-weight:680}
.home-discovery .mood-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.home-discovery .mood-card{border:1px solid var(--line);background:var(--paper);border-radius:14px;overflow:hidden;text-align:left;cursor:pointer;padding:0;color:var(--ink);min-width:0}
.home-discovery .mood-art{height:126px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#e9eee6}
.home-discovery .mood-art:after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(61,92,64,.2);border-radius:50%;right:-35px;top:20px}
.home-discovery .mood-art .ico{width:56px;height:56px;stroke-width:1.05;color:#73937e}
.home-discovery .mood-art.art{background:#efe9de}
.home-discovery .mood-art.art .ico{color:#a59173}
.home-discovery .mood-art.city{background:#e3ece9}
.home-discovery .mood-art .art-no{position:absolute;left:22px;top:23px;font-family:Georgia,serif;font-size:45px;color:rgba(46,84,61,.16)}
.home-discovery .mood-body{padding:22px}
.home-discovery .mood-body h3{font-size:18px;margin:0 0 8px}
.home-discovery .mood-body p{font-size:12px;color:var(--muted);margin:0 0 19px;line-height:1.85}
.home-discovery .mood-card:hover{transform:translateY(-3px);border-color:#adc5b5;box-shadow:var(--shadow-strong)}
.home-discovery>.last-cta{padding-top:18px;padding-bottom:60px}
.preference-tools{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:11px}
.preference-tools>p{font-size:11px;line-height:1.75;color:var(--muted);margin:0;max-width:650px}
#plan-notes{line-height:1.9;min-height:155px}
.polish-box{border:1px solid #cadbd0;border-radius:12px;background:#f5faf4;padding:21px;margin-top:18px}
.polish-heading{display:flex;align-items:center;justify-content:space-between;gap:15px}
.polish-compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:17px 0 13px}
.polish-compare>div{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:17px;min-width:0}
.polish-compare>div:last-child{border-color:#bbd1c0}
.polish-compare strong{font-size:12px;color:var(--ink);display:block}
.polish-compare p{font-size:12px;line-height:1.85;color:var(--muted);margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:265px;overflow:auto}
.polish-explanation{font-size:11px;line-height:1.8;color:var(--muted);margin:0 0 15px}
.polish-actions{display:flex;gap:9px;flex-wrap:wrap}
.polish-applied{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:11px;color:var(--accent)}
.progress-steps{grid-template-columns:repeat(5,minmax(0,1fr))}
.auth-scene{align-items:start;grid-auto-rows:max-content;min-height:0}
.auth-ambient{align-self:start}
.auth-panes{position:relative;min-width:0}
.auth-pane{display:flow-root;position:relative;min-width:0}
.auth-pane[aria-hidden="true"]{position:absolute;top:0;left:0;width:100%;visibility:hidden;pointer-events:none}
.auth-card .auth-privacy{margin-top:0}
@media(max-width:800px){
 .home-discovery .intro-rail{gap:20px;padding:25px 0}
 .home-discovery .intro-rail>div{gap:9px}
 .home-discovery .mood-grid{gap:12px}
 .home-discovery .mood-body{padding:19px 16px}
 .home-discovery .mood-body h3{font-size:16px}
 .home-discovery>.section{padding:48px 0}
 .home-discovery>.last-cta{padding-top:10px}
}
@media(max-width:680px){
 .home-discovery .intro-rail{grid-template-columns:minmax(0,1fr);gap:22px}
 .home-discovery .mood-grid{grid-template-columns:minmax(0,1fr);gap:17px}
 .home-discovery .mood-art{height:126px}
 .home-discovery .mood-body{padding:22px}
 .home-discovery .mood-body h3{font-size:18px}
 .progress-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
 .progress-steps>.progress-step:last-child{grid-column:1/-1}
 .preference-tools{align-items:flex-start;flex-wrap:wrap;gap:12px}
 .polish-compare{grid-template-columns:minmax(0,1fr)}
 .polish-box{padding:16px}
 .polish-heading{align-items:flex-start;flex-direction:column;gap:6px}
}

 ui.plan=p;ui.draftId=t.status==='draft'?t.id:null;ui.planFrom=t.id;ui.displayPreview=null;ui.polish=null;ui.polishUndo=null;ui.formError='';persistPlan();go('/plan');
}
function duplicate(id){if(!requireAccount('duplicate',id))return;const source=findTrip(id)||SEEDS.find(t=>t.id===id);if(!source)return;const t=cloned(source);t.id=uid('trip');t.title=source.title+' (copy)';t.status=source.status==='draft'?'draft':'saved';t.source_origin=source.source_origin||source.origin;t.origin=t.source_origin==='imported'?'imported':'copy';t.created_at=new Date().toISOString();t.source_title=source.title;ownedTrips().unshift(t);persist();ui.modal=null;go('/trips');showToast('An independent copy was added to My trips.');}

function pageHeader(kicker,title,description){return `<div class="page-heading"><span class="eyebrow">${kicker}</span><h1>${title}</h1><p>${description}</p></div>`;}
function taskEntry(){const t=task();if(!t||['cancelled','failed','clarification'].includes(t.status))return '';if(t.status==='completed'&&t.seen)return '';return button(`<span class="task-dot"></span>${t.status==='running'?'Planning your trip':'Itinerary ready'}`,'view-task','task-entry '+(t.status==='running'?'running':''));}
function header(){const path=route().path,a=account();return `<header class="site-header"><div class="container nav-inner">${href('/',`<span class="brand-symbol">${ic('spark',21)}</span><span class="brand-name">Dayloom</span>`,'brand')}<nav class="site-nav" aria-label="Main navigation">${navLink('/','Home',path==='/')}${navLink('/plan','Plan a trip',path==='/plan')}${navLink('/trips','My trips',path.startsWith('/trips'))}</nav><div class="nav-actions"><span id="nav-task-slot">${taskEntry()}</span>${a?button(`${avatar(a.profile)}<span class="account-name">${esc(a.profile.name)}</span>`,'account','account-link','aria-label="Account settings"'):href('/login','Log in','btn btn-quiet btn-small')}${href('/plan',`Start planning ${ic('arrow',16)}`,'btn btn-primary btn-small nav-cta')}${button(ic('menu',23),'mobile-menu','mobile-toggle','aria-label="Open navigation" aria-expanded="'+ui.mobileNav+'"')}</div></div>${ui.mobileNav?`<div class="mobile-panel">${navLink('/','Home',path==='/')}${navLink('/plan','Plan a trip',path==='/plan')}${navLink('/trips','My trips',path.startsWith('/trips'))}${a?navLink('/account','Account settings',path==='/account'):navLink('/login','Log in',path==='/login')}${a?button('Log out','logout','btn btn-quiet btn-small'):''}</div>`:''}</header>`;}
function footer(){return `<footer class="site-footer"><div class="container footer-flex"><div><div class="footer-brand">${ic('spark',21)} Dayloom</div><p>Make room for the places that move you.</p></div><div class="footer-links">${href('/','Home')}${href('/plan','Start planning')}${href('/trips','My trips')}${href(account()?'/account':'/login','My account')}</div></div><div class="container footer-note">Interactive prototype · Accounts and planning are simulated in this browser.${ui.storageWarning?' Browser storage is unavailable; keep this page open.':''} ${button('About this prototype','about','inline-action')}</div></footer>`;}
function home(){return `<section class="home-hero minimal-hero"><div class="container hero-grid"><div class="hero-copy"><span class="hero-kicker">A BETTER WAY TO WANDER</span><h1>So much to discover.<br><em>So easy to plan.</em></h1><p>A destination, a few ideas, a rhythm that feels like you. Bring your days together in one clear itinerary.</p><div class="hero-actions">${href('/plan',`Start planning ${ic('arrow',19)}`,'btn btn-primary btn-large')}${account()?href('/trips',`Explore your trips ${ic('chevron',17)}`,'btn btn-light btn-large'):href('/trips/sydney-example',`View an example ${ic('chevron',17)}`,'btn btn-light btn-large')}</div><p class="hero-disclaimer">${ic('leaf',14)} Thoughtful city experiences, with time for what matters.</p></div><div class="hero-visual"><div class="hero-image">${photo('hero','hero-photo')}<div class="hero-img-mask"></div></div><div class="floating-stamp">${ic('pin',16)} Your next chapter<span>YOUR NEXT DESTINATION</span></div><div class="hero-floating-card"><span class="floating-top">${ic('spark',17)} YOUR JOURNEY, YOUR WAY</span><strong>A little structure. A little spontaneity.</strong><span>Daily places · Easy connections · Nearby discoveries</span><div class="tiny-progress"><i></i><i></i><i></i></div></div></div></div></section><div class="container home-discovery"><div class="intro-rail"><div>${ic('calendar',23)}<div><strong>Built around your time</strong><p>Your dates, daily activities and room to explore.</p></div></div><div>${ic('route',23)}<div><strong>The details, together</strong><p>Weather and travel estimates beside your plans.</p></div></div><div>${ic('info',23)}<div><strong>Clarity where it counts</strong><p>See which details still need confirmation.</p></div></div></div><section class="section"><div class="section-heading"><div><span class="eyebrow">START WITH WHAT YOU LOVE</span><h2>What will this trip feel like?</h2></div><p>Start with the experiences you enjoy. Your interests become part of your travel brief.</p></div><div class="mood-grid">${[['museum','art','01','Follow your curiosity','Find art, culture and stories in galleries and old streets.'],['tree','nature','02','Take the scenic way','Make time for green spaces, waterfronts and open skies.'],['walk','city','03','Leave room for the everyday','Slow down and discover the city one neighborhood at a time.']].map(([icon,c,n,t,d],i)=>`<button type="button" class="mood-card" data-action="mood" data-value="${i}"><div class="mood-art ${c}"><span class="art-no">${n}</span>${ic(icon,52)}</div><div class="mood-body"><h3>${t}</h3><p>${d}</p><span class="text-link">Begin here ${ic('arrow',14)}</span></div></button>`).join('')}</div></section><section class="section last-cta"><div><span class="eyebrow">MAKE ROOM FOR DISCOVERY</span><h2>Your next journey starts with an idea.</h2></div>${href('/plan',`Plan my trip ${ic('arrow',16)}`,'btn btn-primary btn-large')}</section></div>`;}
function choiceGroups(p,prefix=''){
 return `<div class="preference-pair"><div class="field-group"><div class="label-row">${ic('sliders',16)} <strong>Travel pace</strong></div><div class="pace-row">${PACES.map((v,i)=>button(`<span>${['Take it slowly','A little of both','See a little more'][i]}</span><strong>${v}</strong>`,prefix+'pace','pace-btn '+(p.pace===v?'selected':''),`data-value="${v}" aria-pressed="${p.pace===v}"`)).join('')}</div><p class="selection-help">Choose a rhythm for your days.</p></div><div class="field-group transport-selection"><div class="label-row">${ic('route',16)} <strong>Transport preferences</strong></div><div class="pace-row">${TRANSPORTS.map((v,i)=>button(`<span>${ic(['walk','bus','car'][i],17)}</span><strong>${v}</strong>`,prefix+'transport','pace-btn '+(p.transport.includes(v)?'selected':''),`data-value="${v}" aria-pressed="${p.transport.includes(v)}"`)).join('')}</div><p class="selection-help">Choose one or more. Leave empty for no preference.</p></div></div>`;
}
function interestChips(p,prefix=''){return `<div class="field-group"><div class="label-row">${ic('spark',16)} <strong>Experiences you love</strong><span>Choose a few</span></div><div class="chips">${INTERESTS.map(v=>button(`${ic(p.interests.includes(v)?'check':'plus',14)} ${v}`,prefix+'interest','chip '+(p.interests.includes(v)?'active':''),`data-value="${esc(v)}" aria-pressed="${p.interests.includes(v)}"`)).join('')}</div></div>`;}
function polishView(){
 if(ui.polish)return `<section class="polish-box"><div class="polish-heading"><span class="eyebrow">POLISH YOUR PREFERENCES</span><span class="small-muted">Review before applying</span></div><div class="polish-compare"><div><strong>Your original</strong><p>${esc(ui.polish.original)}</p></div><div><strong>A clearer expression</strong><p>${esc(ui.polish.suggested)}</p></div></div><p class="polish-explanation">Check that this still says what you mean. Your original stays unchanged until you apply it.</p><div class="polish-actions">${button('Apply suggestion','apply-polish','btn btn-primary btn-small')}${button('Keep original','dismiss-polish','btn btn-light btn-small')}</div></section>`;
 if(ui.polishUndo)return `<div class="polish-applied">${ic('check',15)}<span>Suggestion applied.</span>${button('Undo','undo-polish','inline-action')}</div>`;
 return '';
}
function progressSection(){const t=task(),done=t?.status==='completed',active=t?.status==='running';const stateText=!t?'Ready when you are.':active?'Your itinerary is taking shape. You can keep exploring Dayloom.':done?'Your itinerary preview is ready.':t.status==='cancelled'?'Planning stopped. Your travel brief is still here.':t.status==='clarification'?'A few details need your attention. Update your brief before trying again.':'Planning could not finish. Your travel brief is still here.';return `<section class="flow-card progress-card" id="generation-progress"><div class="flow-title"><span class="step-number">02</span><div><h2>Planning progress</h2><p>${stateText}</p></div></div><div class="progress-steps">${PROGRESS_STEPS.map((s,i)=>{const complete=done||(t&&i<t.step),current=active&&i===t.step;return `<div class="progress-step ${complete?'complete':''} ${current?'current':''}"><div class="progress-dot">${complete?ic('check',16):i+1}</div><strong>${s}</strong><span>${complete?'Complete':current?'In progress':'Waiting'}</span></div>`;}).join('')}</div>${active?`<div class="inline-stop"><p>Your confirmed brief is being used for this task.</p>${button('Stop planning','stop-generate','btn btn-quiet btn-small')}</div>`:t&&['failed','clarification','cancelled'].includes(t.status)?`<div class="inline-stop"><p>${t.status==='clarification'?'Clarify your destination and any conflicting requests.':'Edit your brief and start again when ready.'}</p>${button('Restore this brief','restore-task','btn btn-light btn-small')}</div>`:''}</section>`;}
function recoveryPanel(){const previews=account()?.previews||[];if(!previews.length)return '';return `<details class="recovery-panel" ${route().params.has('recover')?'open':''}><summary>${ic('layers',17)} Unsaved previews <span class="count-badge">${previews.length}</span></summary><p class="small-muted">Pick up where you left off. These are kept until you save or discard them.</p>${previews.map(t=>`<div class="recovery-row"><div><strong>${esc(t.title)}</strong><small>${fmtDate(t.start_date)} – ${fmtDate(t.end_date)} · ${t.origin==='imported'?'Imported':'Generated'} preview</small></div><div class="recovery-actions">${href('/trips/'+t.id,'View preview','btn btn-light btn-small')}${button('Save','save-result','btn btn-primary btn-small',`data-id="${t.id}"`)}${button('Discard','discard-preview','btn btn-quiet btn-small',`data-id="${t.id}"`)}</div></div>`).join('')}</details>`;}
function resultContent(){const latest=task(),matches=latest&&JSON.stringify(productInput(latest.plan))===JSON.stringify(productInput(ui.plan));const id=ui.displayPreview||(matches?latest.preview_id:null);const t=findTrip(id);if(!t)return `<div class="result-placeholder"><div class="placeholder-glyph">${ic('layers',36)}</div><strong>A new journey is waiting.</strong><p>Fill in your travel brief. Your day-by-day itinerary will appear here.</p>${!account()?button(`${ic('pin',16)} Explore an example`,'open-examples','btn btn-light'):''}</div>`;const st=tripStats(t);return `<div class="result-ready"><div class="result-summary"><div class="result-cover">${photo(t.cover||'nature','cover-img')}<span class="cover-label">${esc(t.destination)}</span></div><div class="result-intro"><span class="eyebrow">YOUR ITINERARY</span><h3>${esc(t.title)}</h3><p>${fmtDate(t.start_date)}–${fmtDate(t.end_date)} ${t.people?'· '+esc(t.people)+' travelers':''}</p><div class="result-highlights"><span>${ic('calendar',15)} ${st.dayCount} days</span><span>${ic('pin',15)} ${st.stopCount} places</span><span>${ic('walk',15)} ${st.transfers} connections</span>${finite(t.activity_budget)?`<span>${ic('leaf',15)} Budget ${money({amount:t.activity_budget,currency:t.currency})}</span>`:''}</div></div></div><div class="preview-days ${st.dayCount>3?'preview-days-many':''}">${t.days.map((d,i)=>`<div class="preview-day"><span class="eyebrow">DAY ${String(i+1).padStart(2,'0')} · ${dt(d.date)}</span><strong>${esc(d.activities.find(a=>!isFree(a))?activityName(d.activities.find(a=>!isFree(a))):'Room to explore')}</strong><p>${d.activities.map(a=>clock(a.start_time)+' '+esc(isFree(a)?'Free time':activityName(a))).join(' · ')}</p></div>`).join('')}</div><div class="result-actions">${t.status==='preview'?button(`${ic('bookmark',17)} Save to My trips`,'save-result','btn btn-primary',`data-id="${t.id}"`):'<span class="resume-hint">'+ic('check',15)+' Saved to My trips</span>'}${href('/trips/'+t.id,`View full itinerary ${ic('arrow',17)}`,'btn btn-light')}</div></div>`;}
function plan(){const p=ui.plan,today=localToday(),last=addDays(today,13);return `<div class="page container plan-page">${pageHeader('YOUR JOURNEY, YOUR WAY','A city journey, made yours.','Pick a destination. Bring your ideas. Make every day a little clearer.')}${recoveryPanel()}${ui.planFrom?`<div class="hint-strip">${ic('copy',18)} ${ui.draftId?'Editing your saved draft.':'Your earlier travel brief is ready to edit. The original itinerary will stay unchanged.'}</div>`:''}<section class="flow-card form-card"><div class="flow-title"><span class="step-number">01</span><div><h2>Tell us how you like to travel</h2><p>A few essentials, and the things that make it your trip.</p></div><span class="count-badge">About 1 minute</span></div><form id="planForm" novalidate><fieldset class="form-fields"><div class="form-grid form-grid-essentials"><label class="field field-destination"><span>${ic('pin',16)} Destination <b>*</b></span><input name="destination" value="${esc(p.destination)}" placeholder="Choose or enter a city" list="city-suggestions" required autocomplete="off"><datalist id="city-suggestions">${['Sydney, Australia','Kyoto, Japan','Melbourne, Australia','Tokyo, Japan','Paris, France','London, United Kingdom','Singapore'].map(c=>`<option value="${c}"></option>`).join('')}</datalist></label><label class="field"><span>${ic('calendar',16)} Start date <b>*</b></span><input type="date" name="start_date" value="${esc(p.start_date)}" min="${today}" max="${last}" required></label><label class="field"><span>${ic('calendar',16)} End date <b>*</b></span><input type="date" name="end_date" value="${esc(p.end_date)}" min="${today}" max="${last}" required></label><label class="field"><span>${ic('users',16)} Travelers <b>*</b></span><input name="people" type="number" min="1" step="1" value="${esc(p.people)}" required placeholder="2"></label><label class="field"><span>${ic('leaf',16)} Whole-trip budget <b>*</b></span><span class="budget-input"><input name="activity_budget" aria-label="Whole-trip budget amount" type="number" min="0" step="0.01" value="${esc(p.activity_budget)}" placeholder="1000" required><select name="currency" aria-label="Budget currency">${CURRENCIES.map(c=>`<option ${p.currency===c?'selected':''}>${c}</option>`).join('')}</select></span></label></div><div class="field-help-row"><p class="subtle-help">Plan ${fmtDate(today)}–${fmtDate(last)}, up to 10 days.</p><p class="subtle-help">Budget is the total for all travelers.</p></div>${interestChips(p)}${choiceGroups(p)}<div class="requirements-pair"><label class="field"><span>${ic('bookmark',16)} Places or experiences to include <small>Optional</small></span><input name="required" value="${esc(p.required)}" placeholder="An art museum, a waterfront walk…"></label><label class="field"><span>${ic('close',16)} Places or experiences to avoid <small>Optional</small></span><input name="exclusions" value="${esc(p.exclusions)}" placeholder="Large malls, very crowded places…"></label></div><label class="field notes-wide"><span>${ic('edit',16)} Additional preferences <small>Optional</small></span><textarea id="plan-notes" name="notes" rows="5" aria-describedby="preference-sync-help" placeholder="Tell us about slow mornings, accessibility needs, or anything else that matters…">${esc(p.notes)}</textarea></label><div class="preference-tools"><p id="preference-sync-help">Your selections appear here. Edit any sentence to make it your own.</p>${button(`${ic('spark',15)} Polish preferences`,'polish','btn btn-quiet btn-small',`id="polish-button" ${p.notes.trim()?'':'disabled'}`)}</div><div id="polish-region" aria-live="polite">${polishView()}</div></fieldset>${ui.formError?`<p class="form-error" role="alert">${ic('alert',15)} ${esc(ui.formError)}</p>`:''}<div class="form-bottom"><p>${ic('shield',16)} City sights and experiences. Accommodation, tickets and travel to your destination are not included.</p><button class="btn btn-primary btn-large" type="submit">${ic('spark',18)} Generate itinerary ${ic('arrow',17)}</button></div><div class="quiet-links" style="margin-top:15px">${button(ui.draftId?'Update draft':'Save travel brief','save-draft','inline-action')}${ui.draftId?button('Save as a new draft','save-as-draft','inline-action'):''}${button('Review travel brief','input-summary','inline-action')}</div></form></section>${progressSection()}<section class="flow-card result-section" id="result"><div class="flow-title"><span class="step-number">03</span><div><h2>Your itinerary</h2><p>Preview every day. Save it when it feels right.</p></div></div>${resultContent()}</section></div>`;}
function filteredTrips(){const list=account()?ownedTrips():SEEDS;const q=ui.search.toLowerCase();return list.filter(t=>(t.title+' '+t.destination).toLowerCase().includes(q)).slice().sort((a,b)=>ui.tripsSort==='name'?a.title.localeCompare(b.title,'en'):ui.tripsSort==='old'?String(a.created_at).localeCompare(String(b.created_at)):String(b.created_at).localeCompare(String(a.created_at)));}
function tripCard(t){const st=tripStats(t),draft=t.status==='draft',sample=t.status==='sample';return `<article class="trip-card"><div class="trip-card-photo"><a class="trip-photo-link" href="#/trips/${t.id}" aria-label="View ${esc(t.title)}">${photo(t.cover||'nature','cover-img')}</a><span class="trip-status ${draft?'status-draft':''}">${draft?'Planning draft':sample?'Example itinerary':t.origin==='imported'?'Imported':'Saved'}</span>${!sample?button(ic('dots',19),'card-menu','card-menu-trigger',`data-id="${t.id}" aria-label="Manage ${esc(t.title)}"`):''}</div><div class="trip-card-body"><div class="trip-card-kicker">${draft?'YOUR NEXT IDEA':'TRIP ITINERARY'}</div><h3>${href('/trips/'+t.id,esc(t.title))}</h3><div class="trip-date">${ic('calendar',16)} ${fmtDate(t.start_date)||'Dates not set'}${t.end_date?' — '+fmtDate(t.end_date):''}</div><p>${esc(t.description||'A journey worth looking forward to.')}</p><div class="trip-card-stats"><span>${ic('calendar',15)} ${draft?Math.max(0,inclusiveDays(t.start_date,t.end_date)):st.dayCount} days</span><span>${ic('pin',15)} ${st.stopCount} stops</span><span>${ic('walk',15)} ${st.transfers} connections</span></div><div class="trip-card-foot">${href('/trips/'+t.id,`View details ${ic('arrow',17)}`,'text-link')}${button(`${ic('copy',15)} Copy`,'duplicate','btn btn-quiet btn-tiny',`data-id="${t.id}"`)}</div></div></article>`;}
function renderTripList(){const list=filteredTrips(),size=4,pages=Math.max(1,Math.ceil(list.length/size));ui.tripsPage=Math.min(pages,Math.max(1,ui.tripsPage));const shown=list.slice((ui.tripsPage-1)*size,ui.tripsPage*size);if(!list.length&&!ui.search&&account())return `<div class="library-empty">${ic('layers',38)}<h2>Your next chapter starts here.</h2><p>Your saved trips and travel briefs will find their home here.</p>${href('/plan?new=1',`Plan your first trip ${ic('arrow',16)}`,'btn btn-primary btn-large')}</div>`;return `<div class="trip-grid">${shown.map(tripCard).join('')}${!ui.search?`<a class="new-trip-card" href="#/plan?new=1"><span class="new-trip-icon">${ic('plus',32)}</span><strong>Another journey, waiting to be written.</strong><p>Choose a destination and begin a new travel brief.</p><span class="new-trip-arrow">Create a trip ${ic('arrow',16)}</span></a>`:''}</div>${!list.length?`<div class="empty-state">${ic('search',32)}<h3>No trips found</h3><p>Try a shorter name or a different destination.</p></div>`:''}<div class="pagination"><span>${list.length} ${account()?'items':'examples'} · Page ${ui.tripsPage} of ${pages}</span><div class="pagination-controls">${button(ic('back',17),'prev-page','page-btn',`${ui.tripsPage===1?'disabled':''} aria-label="Previous page"`)}${Array.from({length:pages},(_,i)=>button(i+1,'page','page-btn '+(ui.tripsPage===i+1?'active':''),`data-value="${i+1}" aria-label="Page ${i+1}"`)).join('')}${button(ic('arrow',17),'next-page','page-btn',`${ui.tripsPage===pages?'disabled':''} aria-label="Next page"`)}</div></div>`;}
function trips(){const guest=!account(),count=(guest?SEEDS:ownedTrips()).length;return `<div class="page container trips-page">${pageHeader('YOUR TRAVEL LIBRARY','My trips',guest?'A few journeys to explore before you write your own.':'Keep the places you have been, and the journeys still to come.')}<section class="library-intro"><div class="library-count"><span class="eyebrow">${guest?'A LITTLE INSPIRATION':'YOUR COLLECTION'}</span><strong>${String(count).padStart(2,'0')}</strong><span>${guest?'example itineraries':'saved trips and drafts'}</span></div><div class="library-copy"><h2>Good places.<br><em>Worth keeping.</em></h2><p>${guest?'See how a few days can come together.':'Plans to look forward to. Memories to return to.'}</p></div>${href('/plan?new=1',`${ic('plus',18)} Create a trip`,'btn btn-primary btn-large')}</section><div class="trips-toolbar"><label class="search-box">${ic('search',18)}<input id="tripSearch" placeholder="Search by trip name or destination" value="${esc(ui.search)}" autocomplete="off" aria-label="Search trips"></label><label class="sort-box">${ic('sliders',16)}<select id="sortTrips" aria-label="Sort trips"><option value="new" ${ui.tripsSort==='new'?'selected':''}>Newest first</option><option value="old" ${ui.tripsSort==='old'?'selected':''}>Oldest first</option><option value="name" ${ui.tripsSort==='name'?'selected':''}>By name</option></select></label></div><div id="tripList">${renderTripList()}</div><div class="quiet-links" style="margin-top:25px">${button(`${ic('download',14)} Import an itinerary`,'import','inline-action')}</div></div>`;}
function authPane(register){const mode=register?'register':'login',active=ui.authTab===mode;return `<section class="auth-pane" id="auth-${mode}-panel" role="tabpanel" aria-labelledby="auth-${mode}-tab" aria-hidden="${!active}" ${active?'':'inert'}><h1>${register?'Your next chapter starts here.':'Welcome back.'}</h1><p class="auth-intro">${register?'Create an account for the journeys ahead.':'Pick up where your travel ideas left off.'}</p><form data-auth-form="${mode}">${register?`<label class="field"><span>${ic('user',16)} Display name</span><input name="name" placeholder="What should we call you?" required autocomplete="name"></label>`:''}<label class="field"><span>${ic('mail',16)} Email address</span><input name="email" type="email" placeholder="you@example.com" required autocomplete="email"></label><label class="field"><span>${ic('lock',16)} Password</span><span class="auth-pass"><input name="password" type="password" minlength="6" placeholder="At least 6 characters" required autocomplete="${register?'new-password':'current-password'}">${button(ic('eye',17),'toggle-password','','aria-label="Show or hide password"')}</span></label>${register?`<label class="field"><span>${ic('shield',16)} Confirm password</span><input name="confirm" type="password" minlength="6" placeholder="Enter your password again" required autocomplete="new-password"></label>`:''}${ui.authError?`<p class="form-error" role="alert">${esc(ui.authError)}</p>`:''}<button class="btn btn-primary btn-large btn-full" type="submit">${register?'Create account':'Log in'} ${ic('arrow',18)}</button></form><p class="auth-switch">${register?'Already have an account?':'New to Dayloom?'} ${button(register?'Log in':'Create an account','auth-tab','',`data-value="${register?'login':'register'}"`)}</p></section>`;}
function auth(){return `<div class="auth-scene"><div class="auth-ambient"><span>EXPLORE MORE,<br>WORRY LESS.</span><div class="auth-scene-img">${photo('sydney','cover-img')}</div></div><div class="auth-card"><div class="auth-mark">${ic('spark',24)} DAYLOOM</div><div class="auth-tabs" role="tablist" aria-label="Account access">${['login','register'].map(mode=>button(mode==='login'?'Log in':'Sign up','auth-tab',ui.authTab===mode?'active':'',`id="auth-${mode}-tab" data-value="${mode}" role="tab" aria-controls="auth-${mode}-panel" aria-selected="${ui.authTab===mode}" tabindex="${ui.authTab===mode?0:-1}"`)).join('')}</div><div class="auth-panes">${authPane(false)}${authPane(true)}</div><div class="auth-privacy">${ic('shield',17)} Your plans and preferences, together in one place.</div></div></div>`;}
let profileEdit=null;
function accountPage(){const a=account();if(!a)return `<div class="page container">${pageHeader('YOUR ACCOUNT','A home for your travel ideas.','Log in to manage your profile and preferences.')}${href('/login','Log in','btn btn-primary')}</div>`;profileEdit||=cloned(a.profile);const p=profileEdit;return `<div class="page container">${pageHeader('A LITTLE MORE YOU','Your account','The details that make every new journey feel familiar.')}<div class="account-layout"><aside class="content-card account-sidebar">${avatar(p,true)}<h3>${esc(p.name)}</h3><p class="small-muted">${esc(data.session)}</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0">${href('/trips','My trips','text-link')}<br><br>${button('Log out','logout','inline-action text-danger')}</aside><section class="content-card account-main"><form id="profileForm"><h2 style="font-size:22px">Profile</h2><div class="avatar-tools">${avatar(p,true)}<div><label class="btn btn-light btn-small" for="avatarFile">${ic('user',15)} Upload photo</label><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>${button('Use initials','reset-avatar','btn btn-quiet btn-small')}<p class="small-muted" style="margin:8px 0 0">JPG, PNG or WebP, up to 2 MB.</p></div></div><div class="form-grid"><label class="field"><span>Display name</span><input name="name" value="${esc(p.name)}" required></label><label class="field"><span>Email address</span><input value="${esc(data.session)}" type="email" readonly></label></div><section class="account-section"><h2>Travel defaults</h2><p class="small-muted">A visible starting point for new travel briefs. Existing drafts and itineraries keep their own preferences.</p><label class="field" style="max-width:240px"><span>Default currency</span><select name="currency">${CURRENCIES.map(c=>`<option ${p.currency===c?'selected':''}>${c}</option>`).join('')}</select></label>${interestChips(p,'profile-')}${choiceGroups(p,'profile-')}<label class="field"><span>Additional /* Prototype question: can explicit activity links make Nearby easy to locate?
   Keep the supplied two-column layout; use inline disclosures below 801px. */
const nearbyKey=(date,id)=>JSON.stringify([date,id]);
const nearbyId=(kind,key)=>'nearby-'+kind+'-'+encodeURIComponent(key);
const nearbyPlaceCount=n=>`${n} ${n===1?'place':'places'}`;
function nearbyGroups(t){
 const anchors=[];
 for(const [dayIndex,d] of array(t.days).entries())for(const a of array(d.activities))
  if(!isFree(a))anchors.push({key:nearbyKey(d.date,a.activity_id),date:d.date,dayIndex,activity:a,items:[]});
 const other=[];
 nearbyEntries(t).forEach((reference,index)=>{
  const candidates=reference.anchor_activity_id?anchors.filter(g=>g.activity.activity_id===reference.anchor_activity_id&&(!reference.associated_day||g.date===reference.associated_day)):[];
  const item={reference,index};
  if(candidates.length===1)candidates[0].items.push(item);else other.push(item);
 });
 return {groups:anchors.filter(g=>g.items.length),other};
}
function nearbyGroup(t,g){
 const open=!ui.nearbyCollapsed.has(g.key),selected=ui.nearbySelected===g.key;
 return `<section class="nearby-group ${selected?'nearby-linked-selected':''}" id="${nearbyId('group',g.key)}" aria-label="Nearby for ${esc(activityName(g.activity))}"><div class="nearby-group-heading"><button type="button" class="nearby-anchor-link" data-action="nearby-back" data-key="${esc(g.key)}" aria-label="Find ${esc(activityName(g.activity))} in Day ${g.dayIndex+1} itinerary">${ic('pin',16)}<span><strong>${esc(activityName(g.activity))}</strong><small>Around this stop · ${nearbyPlaceCount(g.items.length)}</small></span></button>${button(ic('down',16),'nearby-toggle',`nearby-group-toggle ${open?'open':''}`,`data-key="${esc(g.key)}" id="${nearbyId('toggle',g.key)}" aria-label="${open?'Collapse':'Expand'} nearby for ${esc(activityName(g.activity))}" aria-expanded="${open}" aria-controls="${nearbyId('items',g.key)}"`)}</div><div class="nearby-group-items" id="${nearbyId('items',g.key)}" ${open?'':'hidden'}>${g.items.map(({reference,index})=>nearbyRow(t,reference,index)).join('')}</div></section>`;
}
function nearbyPanel(t){
 const {groups,other}=nearbyGroups(t),visible=groups.filter(g=>ui.dayFilter==='all'||g.date===ui.dayFilter),unassigned=other.filter(({reference:n})=>ui.dayFilter==='all'||!n.associated_day||n.associated_day===ui.dayFilter);
 return `<section class="content-card nearby-panel ${unassigned.length?'has-other':''}" id="nearby"><div class="nearby-sidebar-groups"><div class="content-heading"><span class="section-icon nearby-icon">${ic('pin',21)}</span><h2>Nearby · A little discovery</h2></div><p class="aside-intro">Ideas near your planned stops. These are not scheduled visits.</p>${array(t.days).map((d,i)=>{const matches=visible.filter(g=>g.date===d.date);return matches.length?`<section class="nearby-day"><h3>DAY ${i+1} <span>· ${dt(d.date).toUpperCase()}</span></h3>${matches.map(g=>nearbyGroup(t,g)).join('')}</section>`:'';}).join('')}${!visible.length&&!unassigned.length?'<p class="nearby-empty">No nearby ideas for '+(ui.dayFilter==='all'?'these stops.':'this day.')+'</p>':''}</div>${unassigned.length?`<section class="nearby-other" id="nearby-other"><h3>Other nearby references</h3><p class="aside-intro">Optional places without a linked scheduled stop.</p>${unassigned.map(({reference,index})=>nearbyRow(t,reference,index,true)).join('')}</section>`:''}${visible.length||unassigned.length?'<p class="footnote caution-text">'+ic('info',14)+' Straight-line distances are not walking routes.</p>':''}</section>`;
}
function nearbyInline(t,g){
 const open=ui.nearbyInlineOpen.has(g.key);
 return `<section class="nearby-inline" id="${nearbyId('inline',g.key)}">${button(`${ic('pin',14)}<span>Nearby · ${nearbyPlaceCount(g.items.length)}</span>${ic('down',15)}`,'nearby-inline-toggle',`nearby-inline-trigger ${open?'open':''}`,`id="${nearbyId('inline-trigger',g.key)}" data-key="${esc(g.key)}" aria-label="${open?'Hide':'Show'} nearby for ${esc(activityName(g.activity))}" aria-expanded="${open}" aria-controls="${nearbyId('inline-items',g.key)}"`)}<div class="nearby-inline-items" id="${nearbyId('inline-items',g.key)}" ${open?'':'hidden'}><p class="nearby-inline-note">Optional places · not scheduled visits</p>${g.items.map(({reference,index})=>nearbyRow(t,reference,index)).join('')}</div></section>`;
}
let nearbyPulse=0;
function nearbyNavigate(key,destination){
 const t=findTrip(ui.detailTrip),g=t&&nearbyGroups(t).groups.find(g=>g.key===key);if(!g)return;
 ui.dayOpen.add(g.date);ui.nearbyCollapsed.delete(key);
 if(ui.dayFilter!=='all'&&ui.dayFilter!==g.date)ui.dayFilter=g.date;
 const mobile=matchMedia('(max-width:800px)').matches;
 if(mobile)ui.nearbyInlineOpen.add(key);
 ui.nearbySelected=key;const pulse=++nearbyPulse;render();
 requestAnimationFrame(()=>{
  const target=document.getElementById(nearbyId(destination==='stop'?'stop':mobile?'inline':'group',key));
  const focus=destination==='stop'?target:target?.querySelector('button');
  focus?.focus({preventScroll:true});target?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center'});
 });
 setTimeout(()=>{if(pulse!==nearbyPulse)return;ui.nearbySelected=null;document.querySelectorAll('.nearby-linked-selected').forEach(el=>el.classList.remove('nearby-linked-selected'));},2600);
}
function nearbyToggle(key,inline){
 const set=inline?ui.nearbyInlineOpen:ui.nearbyCollapsed;
 set.has(key)?set.delete(key):set.add(key);render();
 requestAnimationFrame(()=>document.getElementById(nearbyId(inline?'inline-trigger':'toggle',key))?.focus({preventScroll:true}));
}
function scrollDetailSection(value){
 let target=document.getElementById(value);
 if(value==='nearby'&&matchMedia('(max-width:800px)').matches){
  const t=findTrip(ui.detailTrip),g=t&&nearbyGroups(t).groups.find(g=>ui.dayFilter==='all'||g.date===ui.dayFilter);
  if(g){nearbyNavigate(g.key,'group');return;}
  target=document.getElementById('nearby-other');
  if(!target){showToast('No nearby ideas for this day.');return;}
 }
 target?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
}

function transferState(t){return t.validation_state==='PASS'?{label:'Time allows this connection',cls:'state-ok',icon:'check',note:'Based on the available route estimate. Actual travel conditions can change.'}:['CONFIRMED','FAIL'].includes(t.validation_state)?{label:'Connection needs attention',cls:'state-conflict',icon:'alert',note:'A timing conflict remains. Review the activities and travel estimate.'}:{label:'Details to confirm',cls:'state-unknown',icon:'info',note:'There is not enough information to confirm this connection.'};}
function transferSummary(t){const s=transferState(t);return `<span>${ic(modeIcon(t.mode),17)} ${modeName(t.mode)} · ${minutes(t.provider_duration_seconds)} <small>· ${distance(t.distance_meters)}</small></span><span class="state-label ${s.cls}">${ic(s.icon,13)} ${s.label}</span>`;}
function weatherFor(d){const w=d.weather;if(w?.status==='available'&&w.forecast){const f=w.forecast,c=f.condition||'Weather';return {icon:/rain|drizzle/i.test(c)?'rain':/sun|clear/i.test(c)?'sun':'cloud',kind:/rain/i.test(c)?'rain':'',label:c,forecast:f};}if(d.weather_note)return {icon:/rain|drizzle/i.test(d.weather_note)?'rain':'cloud',kind:'unknown',label:d.weather_note,forecast:null};return {icon:'cloud',kind:'unknown',label:'Weather unavailable',forecast:null};}
function weatherRows(t){return array(t.days).map(d=>{const w=weatherFor(d),f=w.forecast,temp=f&&(finite(f.min_temperature_c)||finite(f.max_temperature_c))?`${finite(f.min_temperature_c)?f.min_temperature_c:'—'}° / ${finite(f.max_temperature_c)?f.max_temperature_c:'—'}°C`:'';return `<div class="weather-row"><div class="weather-day"><strong>${dt(d.date)}</strong><span>${dayOf(d.date)}</span></div><div class="weather-glyph ${w.kind}">${ic(w.icon,22)}</div><div class="weather-summary"><strong>${esc(temp||w.label)}</strong>${temp?`<small>${esc(w.label)}</small>`:''}${f&&finite(f.precipitation_probability_percent)?`<small>Rain ${esc(f.precipitation_probability_percent)}%</small>`:''}</div></div>`;}).join('');}
function tripNotices(t){const reasons=array(t.policy_reasons),rows=array(t.minimum_daily_coverage).filter(r=>r.status!=='satisfied'),gaps=array(t.preference_coverage).filter(r=>r.status==='gap'||r.status==='unassessed');if(t.policy_completion!=='incomplete'&&!reasons.length&&!rows.length&&!gaps.length)return '';return `<details class="trip-notice" ${t.policy_completion==='incomplete'?'open':''}><summary>${ic('info',15)} A few details need your attention</summary>${reasons.map(v=>`<p>${esc(v)}</p>`).join('')}${rows.map(r=>`<p>${dt(r.date)}: ${r.status==='missing'?'No main visit is arranged yet.':r.status==='exempt'?'A fixed commitment leaves this day without a main visit.':'The day’s coverage could not be fully assessed.'}${r.reason?' '+esc(r.reason):''}</p>`).join('')}${gaps.map(r=>`<p>${esc(r.preference)}: ${r.status==='gap'?'Some of this interest is still missing from the itinerary.':'This preference has not been fully assessed.'}</p>`).join('')}</details>`;}
function tripDetail(t){
 const st=tripStats(t),draft=t.status==='draft',preview=t.status==='preview',sample=t.status==='sample';
 const budget=finite(t.activity_budget)?{amount:t.activity_budget,currency:t.currency}:t.requirements?.budget||t.request?.budget;
 const days=ui.dayFilter==='all'?array(t.days):array(t.days).filter(d=>d.date===ui.dayFilter),nbs=nearbyEntries(t);
 const label=draft?'Planning draft':preview?'Unsaved preview':sample?'Example itinerary':t.origin==='imported'?'Imported itinerary':'Saved itinerary';
 return `<div class="detail-page"><section class="detail-hero"><div class="detail-cover">${photo(t.cover||'nature','detail-hero-image')}<div class="detail-cover-shade"></div></div><div class="container detail-hero-inner">${href(preview?'/plan?recover=1':'/trips',`${ic('back',17)} ${preview?'Back to previews':'Back to My trips'}`,'detail-back')}<span class="detail-eyebrow">${draft?'YOUR NEXT IDEA':'YOUR JOURNEY, DAY BY DAY'}</span><h1>${esc(t.title)}</h1><div class="detail-meta"><span>${ic('pin',17)} ${esc(t.destination)}</span><span>${ic('calendar',17)} ${fmtDate(t.start_date)||'Dates not set'} — ${fmtDate(t.end_date)||'Dates not set'}</span><span>${ic('layers',17)} ${st.dayCount} days / ${st.stopCount} stops</span>${t.people?`<span>${ic('users',17)} ${esc(t.people)} travelers</span>`:''}</div><div class="detail-hero-buttons">${button(`${ic('spark',17)} ${draft?'Continue planning':'Plan again'}`,'replan','btn btn-primary',`data-id="${t.id}"`)}${!draft?button(`${ic('download',17)} Export itinerary`,'export','btn btn-glass',`data-id="${t.id}"`):''}${!draft?button(`${ic('share',17)} Copy summary`,'share','btn btn-glass',`data-id="${t.id}"`):''}${preview?button(`${ic('bookmark',16)} Save to My trips`,'save-result','btn btn-glass',`data-id="${t.id}"`):''}${sample?button(`${ic('copy',16)} Keep a copy`,'duplicate','btn btn-glass',`data-id="${t.id}"`):''}</div></div></section><div class="container detail-below"><nav class="detail-anchor-nav" aria-label="Itinerary sections">${[['overview','layers','Overview'],['daily','calendar','Daily itinerary'],['transport','walk','Connections'],['weather','sun','Weather'],['nearby','pin','Nearby']].map(([id,icon,label])=>button(`${ic(icon,17)} ${label}`,'scroll','',`data-value="${id}"`)).join('')}</nav>${tripNotices(t)}<div class="detail-grid"><div class="detail-main"><section class="content-card overview-panel" id="overview"><div class="content-heading"><span class="section-icon">${ic('layers',21)}</span><h2>Trip overview</h2><span class="historical-pill">${ic('info',13)} ${label}</span></div><p class="overview-lead">${esc(draft?'Your ideas are saved. Come back and make them a journey.':t.description||'Your days, places and connections, together in one itinerary.')}</p><div class="stat-grid"><div><strong>${String(st.dayCount).padStart(2,'0')}</strong><span>days</span></div><div><strong>${String(st.stopCount).padStart(2,'0')}</strong><span>planned stops</span></div><div><strong>${String(st.transfers).padStart(2,'0')}</strong><span>connections</span></div><div><strong class="${budget?'overview-budget':''}">${budget?money(budget):'—'}</strong><span>${budget?'whole-trip budget · not actual spend':'costs to confirm'}</span></div></div>${array(t.interests).length||t.pace||array(t.transport).length?`<div class="request-overview">${[...array(t.interests),...(t.pace?[t.pace+' pace']:[]),...array(t.transport)].map(v=>`<span>${esc(v)}</span>`).join('')}</div>`:''}${t.origin==='imported'?'<p class="footnote">'+ic('info',14)+' Imported content has not been regenerated or rechecked by Dayloom.</p>':''}${preview?'<p class="footnote">'+ic('info',14)+' Kept as a preview until you save or discard it.</p>':''}</section><section class="content-card days-panel" id="daily"><div class="content-heading"><span class="section-icon">${ic('calendar',21)}</span><h2>Daily itinerary</h2>${st.dayCount?button('Expand all','expand-all','btn btn-quiet btn-tiny'):''}</div>${st.dayCount?`<div class="day-filter" aria-label="Filter days">${button('All days','filter-day',ui.dayFilter==='all'?'active':'','data-value="all"')}${t.days.map((d,i)=>button(`Day ${i+1}<small>${dt(d.date)}</small>`,'filter-day',ui.dayFilter===d.date?'active':'',`data-value="${d.date}"`)).join('')}</div>`:''}${draft?`<div class="empty-state inline-empty"><div class="empty-illustration">${ic('layers',32)}</div><h3>Room for your next journey.</h3><p>Keep shaping your brief, then bring your days together.</p>${button('Continue this brief','replan','btn btn-primary',`data-id="${t.id}"`)}</div>`:days.map(d=>dayBlock(t,d,t.days.indexOf(d))).join('')}</section><section class="content-card transport-panel" id="transport"><div class="content-heading"><span class="section-icon">${ic('walk',21)}</span><h2>Between one place and the next</h2><span class="small-muted">${st.transfers} connections</span></div>${st.transfers?t.transfers.map((l,i)=>transportRow(t,l,i)).join(''):'<p class="aside-intro">No connection information is available.</p>'}${st.transfers?'<p class="footnote">'+ic('info',15)+' Route estimates are a guide. Missing details remain to confirm.</p>':''}</section></div><aside class="detail-sidebar"><section class="content-card weather-panel" id="weather"><div class="content-heading"><span class="section-icon weather-icon">${ic('sun',20)}</span><h2>Weather at a glance</h2></div><p class="aside-intro">A little context for each day.</p>${st.dayCount?weatherRows(t):'<p class="aside-intro">Choose your dates to plan your days.</p>'}<p class="footnote">${ic('info',14)} ${sample?'Weather shown belongs to this historical example.':'Saved weather is a snapshot; check current conditions before you go.'}</p></section>${nearbyPanel(t)}<section class="content-card promise-card"><span class="eyebrow">DESIGNED FOR THE EXPERIENCE</span><h3>More time for the place.<br>Less time for the planning.</h3><p>Keep your own rhythm. Make room for the next discovery.</p>${button(`Plan another journey ${ic('arrow',17)}`,'replan','text-link inline-action',`data-id="${t.id}"`)}</section></aside></div></div></div>`;
}
function dayBlock(t,d,i){const open=ui.dayOpen.has(d.date),w=weatherFor(d);return `<article class="day-block ${open?'open':''}"><button type="button" class="day-header" data-action="day-toggle" data-value="${d.date}" aria-expanded="${open}"><span class="day-counter">${String(i+1).padStart(2,'0')}</span><span class="day-head-copy"><strong>${dt(d.date)} · ${dayOf(d.date)} <span>DAY ${String(i+1).padStart(2,'0')}</span></strong><small>${array(d.activities).filter(a=>!isFree(a)).length} places / activities · ${esc(w.label)}</small></span>${ic('down',20)}</button>${open?`<div class="day-events">${array(d.activities).length?d.activities.map(a=>activityEvent(t,a,d.date)).join(''):'<p class="aside-intro">No scheduled activities for this day.</p>'}</div>`:''}</article>`;}
function activityEvent(t,a,date){

function dateTimeValue(value,path){

 if(offset&&offset!=='Z'){const h=Number(offset.slice(1,3)),min=Number(offset.slice(4));if(h>23||min>59)throw Error(path+': invalid UTC offset.');offsetMinutes=(h*60+min)*(offset[0]==='-'?-1:1);}

 return {aware:!!offset,time:seconds*1000000000n+BigInt((m[5]||'').padEnd(9,'0'))-BigInt(offsetMinutes)*60000000000n};
}

 else if(r.path==='/account')content=accountPage();
 else if(r.path.startsWith('/trips/')){const t=findTrip(decodeURIComponent(r.path.slice(7)));content=t?tripDetail(t):`<div class="page container missing">${pageHeader('NOT FOUND','This itinerary is not available.','It may have been removed, or belong to a different account.')}${href('/trips','Back to My trips','btn btn-primary')}</div>`;}
 else content=`<div class="page container missing">${pageHeader('NOT FOUND','A little off the beaten path.','This page could not be found.')}${href('/','Back home','btn btn-primary')}</div>`;
 document.getElementById('app').innerHTML=header()+`<main id="main">${content}</main>`+footer()+modalMarkup()+'<div id="toast" class="toast" role="status" aria-live="polite"></div>';
 document.body.style.overflow=ui.modal?'hidden':'';loadPhotos();
 document.title=({ '/':'Home','/plan':'Plan a trip','/trips':'My trips','/login':'Log in','/account':'Your account'}[r.path]||'Itinerary')+' · Dayloom';
 if(ui.modal)requestAnimationFrame(()=>{document.querySelector('[role="dialog"] input:not([type="hidden"]),[role="dialog"] textarea,[role="dialog"] button')?.focus({preventScroll:true});});
}
function viewTask(){ui.modal=null;const t=task();if(t?.status==='completed'){t.seen=true;persist();const result=findTrip(t.preview_id);if(result){go('/trips/'+result.id);return;}}go('/plan');requestAnimationFrame(()=>document.getElementById('generation-progress')?.scrollIntoView({behavior:'smooth',block:'center'}));}
function act(action,el){const id=el.dataset.id,value=el.dataset.value;
 switch(action){
  case 'mobile-menu':ui.mobileNav=!ui.mobileNav;render();break;
  case 'account':capturePlan();go('/account');break;
  case 'logout':data.session=null;data.pending=null;data.guestPlan=null;ui.plan=freshPlan();ui.draftId=null;ui.displayPreview=null;ui.planFrom=null;ui.modal=null;ui.polish=null;ui.polishUndo=null;profileEdit=null;persist();go('/');showToast('You are logged out.');break;
  case 'auth-tab':ui.authTab=value;ui.authError='';document.querySelectorAll('.auth-tabs [role="tab"]').forEach(tab=>{const active=tab.dataset.value===value;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;});document.querySelectorAll('.auth-pane').forEach(p=>{const active=p.id===`auth-${value}-panel`;p.inert=!active;p.setAttribute('aria-hidden',String(!active));});break;
  case 'toggle-password':{const input=el.parentElement.querySelector('input');input.type=input.type==='password'?'text':'password';break;}
  case 'interest':capturePlan();selectInterest(ui.plan,value);ui.polish=null;ui.polishUndo=null;refreshPreferenceUI();break;
  case 'pace':capturePlan();selectPace(ui.plan,value);ui.polish=null;ui.polishUndo=null;refreshPreferenceUI();break;
  case 'transport':capturePlan();selectTransport(ui.plan,value);ui.polish=null;ui.polishUndo=null;refreshPreferenceUI();break;
  case 'polish':{capturePlan();if(!ui.plan.notes.trim())return;const suggested=ui.plan.notes.split('\n').map(s=>s.trim().replace(/[ \t]+/g,' ')).filter(Boolean).join('\n');ui.polish={original:ui.plan.notes,suggested,originalBindings:cloned(bindings(ui.plan))};ui.polishUndo=null;refreshPreferenceUI();break;}
  case 'apply-polish':{const p=ui.polish;if(!p||p.original!==ui.plan.notes)return;ui.polishUndo={before:p.original,after:p.suggested,bindings:cloned(p.originalBindings)};const newBindings=[];for(const r of p.originalBindings){const at=p.suggested.indexOf(r.text);if(at>=0)newBindings.push({...r,start:at,end:at+r.text.length});else detachControl(ui.plan,r.key);}ui.plan.notes=p.suggested;ui.plan.promptBindings=newBindings;ui.polish=null;refreshPreferenceUI();showToast('Suggestion applied. You can undo it.');break;}
  case 'dismiss-polish':ui.polish=null;refreshPreferenceUI();break;
  case 'undo-polish':{const u=ui.polishUndo;if(!u||ui.plan.notes!==u.after)return;ui.plan.notes=u.before;ui.plan.promptBindings=u.bindings;ui.polishUndo=null;refreshPreferenceUI();showToast('Your original wording has been restored.');break;}
  case 'mood':{capturePlan();const sets=[['Art & museums','History & culture'],['Nature','Free exploration'],['City walks','History & culture']];for(const v of sets[Number(value)]||[])if(!ui.plan.interests.includes(v))selectInterest(ui.plan,v);if(ui.plan.pace!=='Relaxed')selectPace(ui.plan,'Relaxed');ui.polish=null;ui.polishUndo=null;persistPlan();go('/plan');break;}
  case 'input-summary':capturePlan();openModal({type:'input'});break;
  case 'save-draft':saveDraft();break;
  case 'save-as-draft':ui.draftId=null;saveDraft();break;
  case 'busy-save':ui.modal=null;render();saveDraft();break;
  case 'view-task':capturePlan();viewTask();break;
  case 'stop-generate':{tickTask();const t=task();if(t?.status==='running'){t.status='cancelled';t.finished_at=Date.now();persist();render();showToast('Planning stopped. Your brief is still available.');}else{render();showToast('Your itinerary is already complete. The preview is available.');}break;}
  case 'restore-task':if(task()){ui.plan=cloned(task().plan);ui.formError='';persistPlan();render();}break;
  case 'save-result':saveResult(id);break;
  case 'discard-preview':openModal({type:'discard',id});break;
  case 'confirm-discard':account().previews=account().previews.filter(t=>t.id!==id);if(ui.displayPreview===id)ui.displayPreview=null;if(task()?.preview_id===id)task().seen=true;persist();ui.modal=null;render();showToast('Preview discarded.');break;
  case 'replan':replan(findTrip(id));break;
  case 'duplicate':duplicate(id);break;
  case 'card-menu':openModal({type:'menu',id});break;
  case 'rename':openModal({type:'rename',id});break;
  case 'delete':openModal({type:'delete',id});break;
  case 'confirm-delete':account().trips=ownedTrips().filter(t=>t.id!==id);if(ui.draftId===id)ui.draftId=null;persist();ui.modal=null;render();showToast('Removed from My trips.');break;
  case 'prev-page':ui.tripsPage--;render();break;
  case 'next-page':ui.tripsPage++;render();break;
  case 'page':ui.tripsPage=Number(value);render();break;
  case 'day-toggle':ui.dayOpen.has(value)?ui.dayOpen.delete(value):ui.dayOpen.add(value);render();break;
  case 'filter-day':ui.nearbySelected=null;ui.dayFilter=value;if(value!=='all')ui.dayOpen.add(value);render();break;
  case 'expand-all':for(const d of array(findTrip(ui.detailTrip)?.days))ui.dayOpen.add(d.date);render();break;
  case 'activity':openModal({type:'activity',trip:el.dataset.trip,activity:id});break;
  case 'route':openModal({type:'route',trip:el.dataset.trip,activity:id,to:el.dataset.to});break;
  case 'nearby-jump':nearbyNavigate(el.dataset.key,'group');break;
  case 'nearby-back':nearbyNavigate(el.dataset.key,'stop');break;
  case 'nearby-toggle':nearbyToggle(el.dataset.key,false);break;
  case 'nearby-inline-toggle':nearbyToggle(el.dataset.key,true);break;
  case 'nearby-detail':openModal({type:'nearby',trip:el.dataset.trip,index:Number(value)});break;
  case 'scroll':scrollDetailSection(value);break;
  case 'export':openModal({type:'export',id});break;
  case 'export-json':exportTrip(id,'json');break;
  case 'export-text':exportTrip(id,'text');break;
  case 'share':{const t=findTrip(id);if(t)copySummary(t);break;}
  case 'import':if(requireAccount('import'))openModal({type:'import',text:''});break;
  case 'open-examples':if(!account())openModal({type:'examples'});break;
  case 'view-example':ui.modal=null;go('/trips/'+id);break;
  case 'close-modal':closeModal();break;
  case 'about':capturePlan();openModal({type:'about'});break;
  case 'profile-interest':captureProfile();profileEdit.interests=profileEdit.interests.includes(value)?profileEdit.interests.filter(v=>v!==value):[...profileEdit.interests,value];render();break;
  case 'profile-pace':captureProfile();profileEdit.pace=profileEdit.pace===value?'':value;render();break;
  case 'profile-transport':captureProfile();profileEdit.transport=profileEdit.transport.includes(value)?profileEdit.transport.filter(v=>v!==value):[...profileEdit.transport,value];render();break;
  case 'reset-avatar':captureProfile();profileEdit.avatar='';render();break;
  case 'simulate-failure':case 'simulate-clarification':case 'simulate-complete':if(running()){const t=task();t.scenario=action==='simulate-failure'?'failed':action==='simulate-clarification'?'clarification':'complete';t.started_at=Date.now()-t.duration;tickTask();ui.modal=null;render();}break;
 }
}
const app=document.getElementById('app');
app.addEventListener('click',e=>{
 const anchor=e.target.closest('a[href^="#/"]');if(anchor){capturePlan();ui.modal=null;ui.mobileNav=false;if(anchor.hash==='#/plan?new=1'){e.preventDefault();ui.plan=freshPlan(account()?.profile);ui.draftId=null;ui.planFrom=null;ui.polish=null;ui.polishUndo=null;ui.formError='';persistPlan();go('/plan');return;}if(anchor.hash===location.hash){e.preventDefault();render();window.scrollTo({top:0,behavior:'smooth'});}return;}
 const el=e.target.closest('[data-action]');if(!el)return;if(el.classList.contains('modal-backdrop')&&e.target.closest('[data-modal-card]'))return;e.preventDefault();act(el.dataset.action,el);
});
app.addEventListener('input',e=>{
 if(e.target.id==='tripSearch'){ui.search=e.target.value;ui.tripsPage=1;document.getElementById('tripList').innerHTML=renderTripList();loadPhotos();}
 else if(e.target.closest('#planForm')){capturePlan();ui.formError='';refreshPreferenceUI();}
 else if(e.target.closest('#profileForm'))captureProfile();
});
app.addEventListener('change',async e=>{
 if(e.target.id==='sortTrips'){ui.tripsSort=e.target.value;ui.tripsPage=1;document.getElementById('tripList').innerHTML=renderTripList();loadPhotos();}
 if(e.target.id==='importFile'){
  const file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024){showToast('Choose one itinerary file smaller than 5 MB.');return;}
  const text=await file.text();const box=document.getElementById('importText');if(box)box.value=text;if(ui.modal?.type==='import')ui.modal.text=text;
 }
 if(e.target.id==='avatarFile'){
  const file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type)){showToast('Choose a JPG, PNG or WebP image up to 2 MB.');return;}
  captureProfile();const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=canvas.height=200;const scale=Math.max(200/img.width,200/img.height),w=img.width*scale,h=img.height*scale;canvas.getContext('2d').drawImage(img,(200-w)/2,(200-h)/2,w,h);profileEdit.avatar=canvas.toDataURL('image/jpeg',.85);URL.revokeObjectURL(url);render();};img.onerror=()=>{URL.revokeObjectURL(url);showToast('This image could not be opened.');};img.src=url;
 }
});
app.addEventListener('submit',e=>{
 e.preventDefault();const form=e.target;
 if(form.id==='planForm'){beginGenerate();return;}
 if(form.id==='profileForm'){captureProfile();if(!profileEdit.name){showToast('Enter a display name.');return;}account().profile=cloned(profileEdit);persist();render();showToast('Your profile and travel defaults are saved.');return;}
 if(form.id==='renameForm'){const fd=new FormData(form),t=ownedTrips().find(t=>t.id===fd.get('id')),title=String(fd.get('title')||'').trim();if(t&&title){t.title=title;t.updated_at=new Date().toISOString();persist();ui.modal=null;render();showToast('Trip name updated.');}return;}
 if(form.id==='importForm'){
  const text=String(new FormData(form).get('json')||'');try{if(new Blob([text]).size>5*1024*1024)throw Error('Choose one itinerary smaller than 5 MB.');const t=normalizeImport(JSON.parse(text.replace(/^\uFEFF/,'')));account().previews.unshift(t);ui.displayPreview=t.id;persist();ui.modal=null;go('/trips/'+t.id);}catch(error){ui.modal={type:'import',text,error:error instanceof SyntaxError?'The JSON could not be read. Check brackets, quotes and commas.':error.message};render();}return;
 }
 if(form.hasAttribute('data-auth-form')){
  const fd=new FormData(form),email=String(fd.get('email')||'').trim().toLowerCase(),pw=String(fd.get('password')||''),register=form.dataset.authForm==='register';
  if(!/^\S+@\S+\.\S+$/.test(email)||pw.length<6){ui.authError='Enter a valid email and a password of at least 6 characters.';render();return;}
  if(register&&pw!==fd.get('confirm')){ui.authError='Your passwords do not match.';render();return;}
  if(register&&data.accounts[email]){ui.authError='This email already has a local account. Log in instead.';render();return;}
  const pending=data.pending,guestPlan=data.guestPlan;
  if(!data.accounts[email])data.accounts[email]={profile:{...defaultProfile(email),...(register?{name:String(fd.get('name')||'Traveler').trim()}: {})},trips:[],previews:[],task:null,workingPlan:null};
  data.session=email;data.pending=null;data.guestPlan=null;ui.authError='';ui.draftId=null;ui.planFrom=null;ui.displayPreview=null;profileEdit=null;
  ui.plan=pending&&guestPlan?cloned(guestPlan):account().workingPlan?cloned(account().workingPlan):freshPlan(account().profile);if(!pending){ui.draftId=account().workingDraftId||null;ui.planFrom=account().workingFrom||null;}persistPlan();
  if(pending?.action==='duplicate'){duplicate(pending.payload);return;}
  if(pending?.action==='import'){go('/trips');setTimeout(()=>openModal({type:'import',text:''}),0);return;}
  if(pending?.action==='save-draft'){go('/plan');setTimeout(()=>showToast('Your brief is restored. Save it when ready.'),0);return;}
  if(pending?.action==='generate'){go('/plan');setTimeout(()=>showToast('Your brief is restored. Review it and click Generate itinerary to continue.'),0);return;}
  go('/trips');
 }
});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
window.addEventListener('keydown',e=>{
 if(e.target.matches('.auth-tabs [role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const value=e.key==='Home'?'login':e.key==='End'?'register':ui.authTab==='login'?'register':'login';act('auth-tab',{dataset:{value}});document.getElementById(`auth-${value}-tab`)?.focus();}
 if(!ui.modal)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const list=[...document.querySelector('[role="dialog"]').querySelectorAll('a[href],button:not(:disabled),input:not([type="hidden"]),textarea,select')],first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}

 const t=task();if(!t||t.status!=='running')return;

 if(finished){const box=document.getElementById('result');if(box)box.innerHTML='<div class="flow-title"><span class="step-number">03</span><div><h2>Your itinerary</h2><p>Preview every day. Save it when it feels right.</p></div></div>'+resultContent();loadPhotos();showToast(t.status==='completed'?'Your itinerary preview is ready.':t.status==='clarification'?'Your travel brief needs a little clarification.':'Planning did not finish. Your brief is still available.');}
