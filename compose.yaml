name: dayloom
services:
  postgres:
    container_name: postgres
    image: pgvector/pgvector:0.8.2-pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_USER: ${TRIPWORLD_DB_USER:?Set TRIPWORLD_DB_USER}
      POSTGRES_PASSWORD: ${TRIPWORLD_DB_PASSWORD:?Set TRIPWORLD_DB_PASSWORD}
      POSTGRES_DB: ${TRIPWORLD_DB_NAME:-tripworld}
    ports:
      - "127.0.0.1:${TRIPWORLD_DB_PORT:-55432}:5432"
    volumes:
      - dayloom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    shm_size: 256mb
volumes:
  dayloom_pgdata:
    name: ${TRIPWORLD_DB_VOLUME:-dayloom_pgdata}
